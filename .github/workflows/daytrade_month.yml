name: Day trader month simulation
on:
  workflow_dispatch:
    inputs:
      start: { description: "First day (YYYY-MM-DD)", required: false, default: "" }
      end: { description: "Last day (YYYY-MM-DD)", required: false, default: "" }
permissions:
  contents: write
concurrency:
  group: daytrade-month
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Simulate
        env:
          APCA_DT_KEY_ID: ${{ secrets.APCA_DT_KEY_ID }}
          APCA_DT_SECRET_KEY: ${{ secrets.APCA_DT_SECRET_KEY }}
        run: python run.py daytrade-month ${{ github.event.inputs.start && format('--start {0}', github.event.inputs.start) || '' }} ${{ github.event.inputs.end && format('--end {0}', github.event.inputs.end) || '' }}
      - name: Save
        run: |
          git config user.name "trading-bot"; git config user.email "trading-bot@users.noreply.github.com"
          git add state/daytrade_month.json "13 - Day Trading Month Simulation.md"
          git diff --cached --quiet && exit 0
          git commit -m "Day trader month simulation"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
