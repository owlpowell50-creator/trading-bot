# One-off / occasional: download real SEC financials for every company page in the vault.
name: SEC company data
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only the first N companies (blank = all)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: sec-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download from SEC EDGAR
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then L="--limit ${{ github.event.inputs.limit }}"; fi
          python tools/sec_fundamentals.py tools/ciks.tsv sec_fundamentals.jsonl.gz $L
      - name: Save to the sec-data branch (kept off main so it never syncs into Obsidian)
        if: always()
        run: |
          [ -f sec_fundamentals.jsonl.gz ] || exit 0
          mkdir /tmp/out && cp sec_fundamentals.jsonl.gz /tmp/out/
          cd /tmp/out && git init -q -b sec-data && git add . \
            && git -c user.name=trading-bot -c user.email=trading-bot@users.noreply.github.com commit -qm "SEC data $(date -u +%F)" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sec-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-fundamentals
          path: sec_fundamentals.jsonl.gz
          retention-days: 30
