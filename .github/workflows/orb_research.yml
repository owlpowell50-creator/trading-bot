name: Day trader research
on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * 0"      # Sundays: refresh with the latest week
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: data/orb_5min.json.gz
          key: orb-bars-${{ github.run_id }}
          restore-keys: orb-bars-
      - name: Replay the live rules since 2016 and test filters (no trading)
        env:
          APCA_DT_KEY_ID: ${{ secrets.APCA_DT_KEY_ID }}
          APCA_DT_SECRET_KEY: ${{ secrets.APCA_DT_SECRET_KEY }}
        run: python -m tools.orb_research
      - name: Save the results
        run: |
          git config user.name "trading-bot"; git config user.email "trading-bot@users.noreply.github.com"
          git add state/orb_research.json "17 - Day Trader Research.md"
          git diff --cached --quiet && exit 0
          git commit -m "Day trader research $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
